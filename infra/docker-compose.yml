services:
  db:
    image: postgres:16-alpine
    container_name: live_location_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: live_location
      POSTGRES_USER: live_location
      POSTGRES_PASSWORD: live_location
    ports:
      - "5435:5432"
    volumes:
      - live_location_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live_location -d live_location"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8005:8000"
    depends_on:
      - db
    environment:
      - PLACEHOLDER=0
    restart: unless-stopped

volumes:
  live_location_db_data: