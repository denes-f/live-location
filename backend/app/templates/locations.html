<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stored Locations</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
<h2>Stored Locations</h2>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Device ID</th>
    <th>Timestamp</th>
    <th>Latitude</th>
    <th>Longitude</th>
  </tr>
  </thead>
  <tbody>
  {% for loc in locations %}
    <tr>
      <td>{{ loc.id }}</td>
      <td>{{ loc.device_id }}</td>
      <td>{{ loc.timestamp }}</td>
      <td>{{ loc.latitude }}</td>
      <td>{{ loc.longitude }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

</body>
</html>
